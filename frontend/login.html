<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 / 注册 · 黑马商城</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-wrap">
  <!-- 左侧品牌区 -->
  <aside class="auth-brand">
    <div class="logo">黑 马 商 城</div>
    <h1>正品好物<br>新人注册立减 500 元</h1>
    <p>邮箱验证码一键注册，注册完直接下单</p>
    <ul>
      <li>商品服务 8081 · 48 件好物六大品类</li>
      <li>购物车服务 8082 · 随手加购</li>
      <li>订单服务 8083 · 下单扣库存、超时自动取消</li>
      <li>支付服务 8084 · 余额支付与幂等补偿</li>
      <li>用户服务 8085 · 邮箱验证码注册登录</li>
    </ul>
  </aside>

  <!-- 右侧表单 -->
  <section class="auth-panel">
    <div class="auth-card">
      <h2 id="authTitle">欢迎登录</h2>
      <p class="auth-sub" id="authSub">登录后即可下单、查看余额、在线充值</p>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-tab="pwd">密码登录</button>
        <button type="button" class="auth-tab" data-tab="email">邮箱验证码</button>
        <button type="button" class="auth-tab" data-tab="reg">免费注册</button>
      </div>

      <!-- ========== 密码登录 ========== -->
      <form id="pwdForm" class="auth-form" autocomplete="off">
        <div class="field">
          <label for="username">用户名 / 邮箱</label>
          <input id="username" name="username" type="text" placeholder="请输入用户名或注册邮箱" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">密码</label>
          <div class="pwd-field">
            <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password">
            <button type="button" class="pwd-toggle" id="pwdToggle">显示</button>
          </div>
        </div>
        <div class="auth-row">
          <label class="chk"><input type="checkbox" id="remember" checked> 记住用户名</label>
          <span class="link-muted">忘记密码请联系管理员</span>
        </div>
        <button type="submit" class="btn primary block" id="loginBtn">登 录</button>
      </form>

      <!-- ========== 邮箱验证码登录 ========== -->
      <form id="emailForm" class="auth-form hidden" autocomplete="off">
        <div class="field">
          <label for="emailLogin">邮箱</label>
          <input id="emailLogin" type="email" placeholder="注册时绑定的邮箱，如 zhangsan@hmall.com">
        </div>
        <div class="field">
          <label for="emailCode">验证码</label>
          <div class="code-row">
            <input id="emailCode" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码">
            <button type="button" class="code-btn" id="sendLoginCode">获取验证码</button>
          </div>
        </div>
        <div class="form-tip hidden" id="emailTip"></div>
        <button type="submit" class="btn primary block" id="emailLoginBtn">登 录</button>
        <div class="hint">邮箱需先注册。还没账号？切到「免费注册」花 30 秒开一个。</div>
      </form>

      <!-- ========== 注册 ========== -->
      <form id="regForm" class="auth-form hidden" autocomplete="off">
        <div class="field">
          <label for="regUser">用户名</label>
          <input id="regUser" type="text" placeholder="3-20 位，支持中文 / 字母 / 数字 / 下划线">
        </div>
        <div class="field">
          <label for="regEmail">邮箱</label>
          <div class="code-row">
            <input id="regEmail" type="email" placeholder="用于接收验证码">
            <button type="button" class="code-btn" id="sendRegCode">获取验证码</button>
          </div>
        </div>
        <div class="field">
          <label for="regCode">验证码</label>
          <input id="regCode" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码">
        </div>
        <div class="field">
          <label for="regPwd">密码</label>
          <input id="regPwd" type="password" placeholder="6-32 位，登录和支付都用它">
        </div>
        <div class="field">
          <label for="regPwd2">确认密码</label>
          <input id="regPwd2" type="password" placeholder="再输入一次">
        </div>
        <div class="form-tip hidden" id="regTip"></div>
        <button type="submit" class="btn primary block" id="regBtn">注册并登录</button>
        <div class="hint">注册即送 <b>500 元</b> 新人礼金，可直接下单体验完整链路</div>
      </form>

      <div class="demo-accounts" id="demoBox">
        <div class="demo-title">演示账号（点击自动填入，密码均为 123456）</div>
        <div class="demo-chips">
          <button type="button" class="chip" data-user="zhangsan" data-pwd="123456">zhangsan · 余额 5000</button>
          <button type="button" class="chip" data-user="lisi" data-pwd="123456">lisi · 余额 3000</button>
          <button type="button" class="chip" data-user="wangwu" data-pwd="123456">wangwu · 余额 1000</button>
        </div>
      </div>
    </div>
  </section>
</div>

<div id="toast" class="toast hidden"></div>

<script src="session.js"></script>
<script src="login.js"></script>
</body>
</html>
