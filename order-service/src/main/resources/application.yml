server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${hmall.data.dir:./data}/hm_order;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  cloud:
    nacos:
      discovery:
        enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

hmall:
  remote:
    item-url: http://localhost:8081
    cart-url: http://localhost:8082
  order:
    # 超时未支付订单自动取消（复用 cancelOrder，会回补库存）
    timeout-enabled: true
    timeout-minutes: 30      # 超过 30 分钟仍待支付就取消；设 0 可立即验证
    cancel-scan-ms: 60000    # 扫描间隔，默认 1 分钟
