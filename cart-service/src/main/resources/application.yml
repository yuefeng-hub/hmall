server:
  port: 8082

spring:
  application:
    name: cart-service
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${hmall.data.dir:./data}/hm_cart;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  cloud:
    nacos:
      discovery:
        enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

hmall:
  remote:
    item-url: http://localhost:8081
