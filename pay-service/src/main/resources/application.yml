server:
  port: 8084

spring:
  application:
    name: pay-service
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${hmall.data.dir:./data}/hm_pay;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  cloud:
    nacos:
      discovery:
        enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

hmall:
  remote:
    order-url: http://localhost:8083
    user-url: http://localhost:8085
  pay:
    # 支付对账补偿：重放「扣款成功但订单状态没跟上」的回调
    reconcile-enabled: true
    reconcile-lookback-minutes: 120   # 只回看最近 2 小时支付成功的单
    reconcile-scan-ms: 60000          # 扫描间隔
