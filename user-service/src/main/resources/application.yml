server:
  port: 8085

spring:
  application:
    name: user-service
  # 本地私有配置（QQ 邮箱发件凭据等），已在 .gitignore 里排除，不进仓库。
  # optional: 前缀保证文件不存在也能正常启动。
  config:
    import: optional:classpath:application-local.yml
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${hmall.data.dir:./data}/hm_user;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  # 发信配置：默认全部为空 = 降级模式（验证码只打到后端日志，接口照常可用）。
  # 要真的发邮件，把用户名和授权码填到 application-local.yml（已被 .gitignore 排除），
  # 由上面那行 spring.config.import 导入，见 README「配一次就能真发邮件」。
  # 系统环境变量 MAIL_USERNAME / MAIL_PASSWORD 优先级更高，可临时覆盖。
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  cloud:
    nacos:
      discovery:
        enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.hmall: info
