version: "3.8"

# 课程原版环境：MySQL 8 + Nacos 2.1（单机模式，内置 Derby 存 Nacos 自身数据）
# 启动：docker compose up -d
services:
  mysql:
    image: mysql:8.0.31
    container_name: hm-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123"
      TZ: Asia/Shanghai
    volumes:
      - ./db/all.sql:/docker-entrypoint-initdb.d/all.sql:ro
      - hm-mysql-data:/var/lib/mysql
    networks:
      - hm-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.1.0-slim
    container_name: hm-nacos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"          # 演示环境关闭鉴权；需要 nacos/nacos 登录时改为 true
      JVM_XMS: 256m
      JVM_XMX: 256m
    networks:
      - hm-net

volumes:
  hm-mysql-data:

networks:
  hm-net:
    driver: bridge
